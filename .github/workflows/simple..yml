name: simple c1 pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4
        - name: Print debug and dummy test  
          run: echo "checking out code..."
        - name: Build docker image
          run: |
            docker build -t python-hello-world:latest /ci.-cd-pipeline/app
            echo "Docker image built successfully."



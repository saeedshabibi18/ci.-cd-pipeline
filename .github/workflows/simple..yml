name: simple c1 pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: docker login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Print debug and dummy test  
          run: echo "checking out code..."
        - name: Build docker image
          run: |
            docker build -t python-hello-world:latest ./app
            echo "Docker image built successfully."
  deploy:
      runs-on: ubuntu-latest
      needs: build-and-test
      steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: docker login
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/python-hello-world:latest

name: simple c1 pipeline

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Debug mode'
        required: false
        default: 'false'
        type: string  

jobs:
  build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Print debug and dummy test  
          run: |
            echo "Debug mode is ${{inputs.debug_mode}}:"
            echo "Installing dependencies and running tests..."
 

